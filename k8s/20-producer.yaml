# Productor de sensores urbanos.
# El código (apps/producer/) llega como ConfigMap "producer-code" y se monta en /app.
# Se crea con: kubectl create configmap producer-code --from-file=apps/producer/ ...
apiVersion: apps/v1
kind: Deployment
metadata:
  name: urban-producer
  namespace: urban-sensors
  labels:
    app: urban-producer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: urban-producer
  template:
    metadata:
      labels:
        app: urban-producer
    spec:
      enableServiceLinks: false
      containers:
        - name: producer
          image: python:3.12-slim
          command: ["/bin/sh", "-c"]
          args:
            - pip install --no-cache-dir --quiet -r /app/requirements.txt && exec python -u /app/producer.py
          envFrom:
            - configMapRef:
                name: kafka-client-config
            - configMapRef:
                name: producer-config
          volumeMounts:
            - name: code
              mountPath: /app
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
      volumes:
        - name: code
          configMap:
            name: producer-code
